<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Command Input</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hello! Please specify the message you want to print using the <code>echo</code> command!</h1>
        <form action="/" method="GET">
            <label for="message">Message to print:</label>
            <input type="text" id="message" name="message" value="&quot;Hello\nWorld!&quot;">
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
