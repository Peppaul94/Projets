<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hello! Please specify the name of the file you would like to see!</h1>
        <form action="/" method="GET">
            <label for="fileName">File Name:</label>
            <input type="text" id="fileName" name="name" value="exemple.txt">
            <button type="submit">Open File</button>
        </form>
    </div>
</body>
</html>
